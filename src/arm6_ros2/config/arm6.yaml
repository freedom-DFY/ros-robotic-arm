# HARDWARE ONLY: J1..6 use IDs 1,2,3,5,4,11, followed by the gripper.
# Gripper ID12: closed 3180 -> 4095 -> 0 -> open 280; opening width is pending.
# Verify model 1000 on ID5, ID11 and the gripper during the scan.
# Geometry is converted from the supplied CAD standard DH to Craig modified DH.
# q=0 is the CAD saved pose; positive rotation follows each servo's local +Z.
# Legacy zero_ticks/directions/limits require alignment and revalidation for CAD.
# ID5: -145..45 deg about tick 2048 (+1), stored inward as 399..2560 ticks.
# ID4/ID11: 0..4095 ticks, bounded single-turn motion without endpoint wrapping.
# J5/J6 encoder alignment and gripper physical opening width remain pending.
# Modified DH: Rx(alpha_prev) Tx(a_prev) Rz(q+offset) Tz(d); metres and radians.
# Row i stores a[i-1], alpha[i-1], d[i], theta_offset[i]; do not use standard rows.
# Protocol 2.0, Homing Offset 0; J1..6 Mode 3, zero-crossing gripper Mode 4.
# Torque On by Goal Update must be OFF. Startup does not enable torque.
# calibration_confirmed gates motion; geometry_confirmed also gates TCP targets.
# Confirmed encoder home can run separately, without changing CAD zero_ticks.
/**:
  ros__parameters:
    device: /dev/ttyUSB0
    baud_rate: 1000000
    base_frame: arm6_cad
    calibration_confirmed: false
    geometry_confirmed: false
    home_on_enable: true
    home_confirmed: true
    home_ticks: [3449, 1227, 1416, 1117, 1298, 2525]  # User-defined physical origin, independent of CAD.
    home_arrival_tolerance_rad: 0.05235987755982989  # 3 degrees, homing only.
    calibration_jog_step_ticks: 20  # Single selected joint only; about 1.76 degrees.
    gamepad_speed_scale: 3.0  # Gamepad velocity multiplier; manual jogs unchanged.
    gamepad_cartesian_speed_m_s: 0.01
    gamepad_command_timeout_s: 0.25
    gamepad_cartesian_step_m: 0.003
    gamepad_jog_step_ticks: 60
    gamepad_settle_time_s: 0.05
    motor_ids:
    - 1
    - 2
    - 3
    - 5
    - 4
    - 11
    - 12  # Gripper; seven distinct IDs required.
    expected_model_numbers:
    - 1120
    - 1120
    - 1120
    - 1000
    - 1000
    - 1000
    - 1000
    zero_ticks:
    - 3819
    - 989
    - 2013
    - 2048
    - 2048
    - 2048
    joint_directions:
    - 1
    - -1
    - -1
    - 1
    - 1
    - 1
    position_min_ticks:
    - 0
    - 740
    - 1043  # Current holding pose sampled at 1043..1044; user requested new lower bound.
    - 399
    - 0
    - 0
    position_max_ticks:
    - 4095
    - 2700
    - 3347
    - 2560
    - 4095
    - 4095
    dh_a_m:
    - 0.0
    - 0.0
    - 0.2489377
    - 0.0000077
    - 0.0
    - 0.0
    dh_d_m:
    - 0.0495
    - 0.0
    - -0.011977
    - 0.2905981
    - 0.0
    - 0.0735
    dh_alpha_rad:
    - 0.0
    - 1.5707963267948966
    - 0.0
    - 1.5707963267948966
    - 1.5707963267948966
    - -1.5707963267948966
    dh_offsets_rad:
    - 1.5256376777287952
    - 1.0563936910253557
    - 0.20237092676874252
    - -1.5707963267948966
    - 0.0
    - 0.0
    # Frame 6 = gripper adapter CAD origin; d6 already includes the 73.5 mm.
    # Zero tool transform until the actual grasp-point TCP is measured.
    tcp_xyz_m:
    - 0.0
    - 0.0
    - 0.0
    tcp_rpy_rad:
    - 0.0
    - 0.0
    - 0.0
    gripper_closed_ticks: 3180
    gripper_open_ticks: 280
    gripper_wraps_zero: true
    gripper_max_width_m: 0.06
    gripper_speed_m_s: 0.01
    gripper_goal_pwm_limit: 132
    gripper_contact_preload_ticks: 5
    joint_velocity_limits_rad_s:
    - 0.02
    - 0.02
    - 0.02
    - 0.1
    - 0.1
    - 0.1
    joint_acceleration_limits_rad_s2:
    - 0.04
    - 0.04
    - 0.04
    - 0.2
    - 0.2
    - 0.2
    gripper_acceleration_m_s2: 0.02
    profile_acceleration: 5
    profile_velocity: 12
    rate_hz: 30.0
    feedback_timeout_s: 0.25
    max_tracking_error_rad: 0.12
    gripper_tracking_error_m: 0.006
    arrival_tolerance_rad: 0.008
    gripper_arrival_tolerance_m: 0.001
    settle_time_s: 0.2
    arrival_timeout_s: 5.0
    cartesian_resolution_m: 0.005
    cartesian_resolution_rad: 0.05
    max_ik_joint_step_rad: 0.25
    max_trajectory_duration_s: 300.0
    max_waypoints: 2000
