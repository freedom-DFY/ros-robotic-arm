# HARDWARE ONLY: six rotary arm joints (ID1..6) plus independent gripper (ID7).
# J1..3 retain measured zero/direction/limits and original wrist-point geometry.
# J4..6 and gripper are ASSUMED: replace with selected hardware calibration.
# Standard DH: Rz(q+offset) Tz(d) Tx(a) Rx(alpha); metres and radians.
# All motors: compatible electrical bus, Protocol 2.0, Mode 3, Homing Offset 0.
# Torque On by Goal Update must be OFF. Startup does not enable torque.
# calibration_confirmed gates motion; geometry_confirmed also gates TCP targets.
/**:
  ros__parameters:
    device: /dev/ttyUSB0
    baud_rate: 1000000
    base_frame: arm3_reference
    calibration_confirmed: false
    geometry_confirmed: false
    motor_ids:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
