/**:
  ros__parameters:
    dry_run: true
    device: /dev/ttyUSB0
    baud_rate: 1000000
    base_frame: base_link
    # Original five-axis modified DH table, truncated at the J4 origin.
    upper_arm_m: 0.24606
    forearm_m: 0.24225
    base_height_m: 0.0
    dh_offsets_rad: [1.5707963267948966, -1.444, -1.444]

    motor_ids: [1, 2, 3]
    expected_model_number: 1120  # XM540-W270; verify against your three motors.
    zero_ticks: [2048, 2048, 2048]
    joint_directions: [1, 1, 1]
    # Dry-run defaults only. Measure and tighten every mechanical limit first.
    position_min_ticks: [0, 0, 0]
    position_max_ticks: [4095, 4095, 4095]
    # Uncalibrated template. Use the measured mechanical bounds in the real config.
    # These bounds also constrain returning to the fixed start.
    mechanical_min_ticks: [0, 0, 0]
    mechanical_max_ticks: [4095, 4095, 4095]
    calibration_confirmed: false
    dry_start_ticks: [2048, 2160, 1910]

    rate_hz: 30.0
    joint_speed_rad_s: 0.15
    cartesian_speed_m_s: 0.025
    path_resolution_m: 0.005
    max_path_joint_step_rad: 0.30
    max_tracking_error_rad: 0.12

    # Register units for velocity-based profiles only. Time-based profiles are
    # calculated from rate_hz (33 ms total, 8 ms acceleration at 30 Hz).
    profile_acceleration: 5
    profile_velocity: 12
    joy_joint_steps_ticks: [16, 8, 8]
    joy_cartesian_step_m: 0.01
    # A single service call returns to this encoder start, settles, then runs the line.
    fixed_start_ticks: [2048, 2160, 1910]
    fixed_line_delta_m: [0.0, -0.20, 0.0]
    fixed_arrival_tolerance_ticks: 10
    fixed_settle_time_s: 0.5
    fixed_stage_timeout_s: 120.0
